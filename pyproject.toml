[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "venv",
    "env",
    ".venv",
    "media",
    "staticfiles",
    "*/migrations/*",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Тестовые настройки намеренно подключают всё из основного settings.py.
"solarWorld/test_settings.py" = ["F403", "F405"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | venv
  | env
  | migrations
  | staticfiles
  | media
)/
'''
