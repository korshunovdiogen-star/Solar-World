{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="{% static 'images/favicon.ico' %}?v=2" sizes="any">
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}?v=2" sizes="512x512">
    <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}?v=2">
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="preload" as="font" type="font/woff2" href="{% static 'fonts/orbitron-variable.woff2' %}" crossorigin>
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/button_favorite.css' %}">
    {% block css_additional %} {% endblock %}
</head>
<body>
    <nav class="top-nav">
        <div class="nav-links">

            <a href="{% url 'main' %}" class="nav-item sound-hover"><i class="fa-brands fa-empire"></i> ГЛАВНАЯ</a>
            <a href="{% url 'planet_list' %}" class="nav-item sound-hover"><i class="fas fa-map"></i> КАРТА</a>
            <a href="{% url 'catalog' %}" class="nav-item sound-hover"><i class="fas fa-search"></i> КАТАЛОГ</a>
            <a href="{% url 'shop:shop_catalog' %}" class="nav-item sound-hover"><i class="fas fa-store"></i> МАГАЗИН</a>
            <a href="{% url 'shop:cart' %}" class="nav-item sound-hover"><i class="fas fa-shopping-cart"></i> КОРЗИНА</a>
        </div>
        <div class="nav-profile">
            {% if user.is_authenticated %}
            <a href="{% url 'profile' %}" class="nav-item sound-hover profile-icon">
                <i class="fas fa-user-astronaut"></i> {{ user.username|truncatechars:10 }}
            </a>
            {% else %}
            <a href="{% url 'login' %}" class="nav-item sound-hover">
                <i class="fas fa-sign-in-alt"></i> Вход
            </a>
            {% endif %}
        </div>
    </nav>

    <div class="back-container">
        <a href="javascript:history.back()" class="nav-item sound-hover back-button">
            ← Назад
        </a>
    </div>


    <script>
        window.soundUrl = "{% static 'sounds/hover-button.mp3' %}";
    </script>
    <script src="{% static 'js/button.js' %}"></script>


    <script src="{% static 'js/button_favorite.js' %}"></script>


    {% block content %}
    {% endblock %}
</body>
</html>
