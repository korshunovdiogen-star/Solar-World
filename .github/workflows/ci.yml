name: Django CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      # Секрет из настроек репозитория; если он не задан, берётся тестовый.
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-only-secret-key-not-for-production' }}
      DEBUG: 'False'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Check project configuration
        run: python manage.py check

      - name: Apply migrations to PostgreSQL
        run: |
          python manage.py upgrade_user_model
          python manage.py migrate --noinput

      - name: Run tests
        run: pytest -q

  # CD включается переменной репозитория ENABLE_DEPLOY=true.
  # Секреты задаются в Settings -> Secrets and variables -> Actions.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
      ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
      DJANGO_SITE_ID: ${{ secrets.ALWAYSDATA_DJANGO_SITE_ID }}
      FASTAPI_SITE_ID: ${{ secrets.ALWAYSDATA_FASTAPI_SITE_ID }}

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY_B64: ${{ secrets.ALWAYSDATA_SSH_KEY_B64 }}
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Основной формат — ключ в base64 одной строкой: так он не
          # ломается от переводов строк Windows. Обычный текст оставлен
          # как запасной вариант.
          if [ -n "$SSH_KEY_B64" ]; then
            printf '%s' "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          else
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519

          if ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "Приватный ключ читается: OK"
          else
            echo "::error::Приватный ключ в секрете повреждён. Пересоздай секрет ALWAYSDATA_SSH_KEY_B64 из файла solar_world_deploy."
            echo "Строк: $(wc -l < ~/.ssh/id_ed25519), байт: $(wc -c < ~/.ssh/id_ed25519)"
            exit 1
          fi

          # Секрет с known_hosts не обязателен: если его нет,
          # ключ хоста получаем на раннере автоматически.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" 'bash -s' <<'DEPLOY'
          set -eu
          cd "$HOME/solar-world"
          git fetch --depth 1 origin main
          git reset --hard FETCH_HEAD
          . "$HOME/venv/bin/activate"
          pip install -r requirements.txt
          python manage.py upgrade_user_model
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          DEPLOY

      - name: Restart alwaysdata sites
        if: env.API_KEY != ''
        run: |
          for site in "$DJANGO_SITE_ID" "$FASTAPI_SITE_ID"; do
            curl -fsS -X POST \
              --retry 3 --retry-delay 5 --retry-connrefused \
              --basic --user "${API_KEY} account=${ACCOUNT}:" \
              "https://api.alwaysdata.com/v1/site/${site}/restart/"
            echo
          done

      - name: Remind to restart manually
        if: env.API_KEY == ''
        run: |
          echo "::warning::ALWAYSDATA_API_KEY не задан: код обновлён, но сайты не перезапущены. Перезапусти Django и FastAPI в панели alwaysdata."

